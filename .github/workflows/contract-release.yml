name: Contract Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

env:
  HOME_DOMAIN: "payd.protocolguild.xyz"
  RUST_VERSION: "1.84.1"
  CARGO_TERM_COLOR: always

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        contract:
          - name: payd-escrow
            path: contracts/escrow
          - name: payd-token
            path: contracts/token
          - name: payd-router
            path: contracts/router
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build ${{ matrix.contract.name }}
        run: cargo build --release --manifest-path ${{ matrix.contract.path }}/Cargo.toml

      - name: Generate release artifact metadata
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          METADATA_FILE="${{ matrix.contract.name }}_${TAG}.json"
          cat > "$METADATA_FILE" <<EOF
          {
            "contract": "${{ matrix.contract.name }}",
            "version": "$TAG",
            "home_domain": "${{ env.HOME_DOMAIN }}",
            "artifact_path": "${{ matrix.contract.path }}/target/release/${{ matrix.contract.name }}",
            "build_timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "rust_version": "${{ env.RUST_VERSION }}"
          }
          EOF

      - name: Upload release artifacts
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            ${{ matrix.contract.name }}_*.json
          generate_release_notes: true
